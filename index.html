<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>∞ JULIA+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">∞ JULIA+</div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-content">
      <h2 id="hero-titulo"></h2>
      <p id="hero-descricao"></p>
      <button id="hero-botao">▶ Assistir</button>
    </div>
  </section>

  <main>
    <section id="tela-lista">
      <h2>Episódios</h2>
      <div class="episodios" id="lista-episodios">
        <!-- Os cards de episódio serão inseridos aqui pelo JavaScript -->
      </div>
    </section>

    <section id="tela-detalhe" class="oculto">
      <button id="botao-voltar">&larr; Voltar</button>
      <h2 id="detalhe-titulo"></h2>
      <p id="detalhe-data"></p>
      <p id="detalhe-descricao"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
